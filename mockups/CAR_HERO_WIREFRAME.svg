<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252">
  <!--
    Hero view, front three-quarter. Reference art for CarHeroView.tsx.

    The body outline is AUTO-TRACED from mockups/volvo_exterior_4.png (the vehicle's own
    exteriorImageUrl render at angle=4), so the silhouette is this exact XC60 rather than a
    generic SUV. Interior parts were placed against a coordinate grid rendered over that same
    photo in this same 640x252 viewBox - regenerate it if parts need moving, do not eyeball.

    Body fill stands in for VehicleDetails.externalColour and is never a status colour.
    Status in this view reads as stroke plus badge on the part regions below; the flat
    green/red fills belong to the top-down view.

    Door regions carry the hinge metadata the component needs: both doors here hinge at their
    FORWARD (smaller x) edge. On the near flank an outward swing is a POSITIVE rotation.
  -->
  <g id="car-hero">
    <ellipse cx="330" cy="236" rx="290" ry="13" fill="#000000" opacity="0.10"/>

    <path id="body" d="M411.7,0.0 L454.8,0.5 L512.2,5.1 L549.2,10.7 L558.5,14.4 L557.1,14.4 L557.1,15.3 L563.1,16.2 L579.3,20.8 L584.4,22.7 L586.7,25.5 L586.3,27.3 L584.0,30.1 L611.3,52.8 L637.7,79.7 L639.1,85.2 L639.1,96.8 L637.7,105.6 L636.8,107.0 L635.4,128.7 L634.4,132.0 L634.9,135.2 L639.5,143.1 L639.5,148.2 L638.6,150.5 L640.0,151.9 L640.0,161.2 L638.1,169.0 L637.7,183.8 L636.8,185.7 L633.5,188.0 L631.2,188.0 L613.1,193.6 L611.3,206.1 L609.0,213.0 L604.3,222.3 L596.9,231.5 L590.4,236.6 L584.0,239.9 L579.3,241.3 L553.9,241.3 L547.8,240.8 L542.3,239.0 L533.0,233.4 L526.1,226.5 L520.5,217.7 L516.4,207.9 L456.2,208.9 L454.8,209.8 L452.4,214.9 L448.3,220.9 L441.3,227.8 L431.6,233.4 L423.3,235.3 L398.7,234.8 L391.3,232.5 L382.1,226.9 L375.6,220.4 L369.1,209.8 L370.5,208.9 L367.7,208.4 L297.3,210.7 L278.3,212.6 L272.3,226.0 L266.3,234.8 L255.2,245.0 L243.6,250.5 L203.3,250.5 L193.1,246.4 L185.7,241.3 L177.4,232.5 L172.7,225.5 L166.7,211.6 L134.3,211.2 L126.4,224.6 L119.0,232.9 L110.7,239.0 L101.4,243.1 L65.8,243.1 L55.6,239.4 L44.9,232.0 L36.1,221.4 L29.6,207.5 L17.6,207.5 L6.5,205.2 L3.2,201.9 L0.0,196.8 L0.0,195.4 L5.1,189.9 L2.8,187.6 L6.9,172.3 L6.9,167.6 L4.6,162.5 L1.9,150.5 L1.9,138.9 L2.8,135.7 L3.7,119.0 L5.6,114.8 L10.7,109.8 L21.3,102.8 L32.9,96.8 L55.6,88.9 L74.1,84.7 L118.1,78.7 L154.2,75.5 L166.3,73.2 L173.7,69.5 L203.3,50.0 L227.4,36.1 L241.7,28.7 L259.8,21.3 L272.8,14.4 L279.2,12.0 L301.0,8.3 L311.7,7.4 L317.2,7.9 L347.3,4.6 L379.7,3.7 L393.2,1.4 L411.7,0.0 Z" fill="#2E333B"/>

    <!-- upper-body highlight so the shoulder reads -->
    <path d="M300,14 L520,16 L566,30 L560,44 L300,40 Z" fill="#3C424C" opacity="0.5"/>

    <!-- greenhouse -->
    <path id="windshield" d="M214,55 L299,12 L352,12 L282,62 Z" fill="#C4CED6" opacity="0.88"/>
    <path id="window-fl"  d="M362,24 L438,19 L438,78 L362,81 Z" fill="#C4CED6" opacity="0.88"/>
    <path id="window-rl"  d="M446,19 L516,17 L516,77 L446,79 Z" fill="#C4CED6" opacity="0.88"/>
    <path id="window-quarter" d="M522,18 L566,24 L572,72 L522,76 Z" fill="#C4CED6" opacity="0.88"/>

    <!-- mirror -->
    <path d="M326,50 L356,46 L362,62 L330,66 Z" fill="#16191E"/>

    <!-- front lighting and grille -->
    <path id="headlight" d="M88,112 L182,102 L184,124 L92,136 Z" fill="#16191E"/>
    <path d="M96,122 L178,108 L179,114 L97,129 Z" fill="#E9EFF3"/>
    <path id="grille"    d="M6,114 L86,109 L88,156 L8,161 Z" fill="#16191E"/>
    <path d="M18,170 L118,164 L120,178 L20,184 Z" fill="#16191E" opacity="0.45"/>

    <!-- wheels: radii match the traced arch openings -->
    <g id="tyre-fl">
      <circle cx="235" cy="182" r="55" fill="#15171B"/>
      <circle cx="235" cy="182" r="34" fill="#AEB2B8"/>
      <line x1="244.6" y1="185.0" x2="265.6" y2="191.5" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="235.1" y1="192.0" x2="235.5" y2="214.0" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="225.5" y1="185.2" x2="204.7" y2="192.3" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="229.0" y1="174.0" x2="215.8" y2="156.4" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="240.8" y1="173.8" x2="253.4" y2="155.8" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="235" cy="182" r="9"  fill="#7E838A"/>
    </g>
    <g id="tyre-rl">
      <circle cx="582" cy="185" r="52" fill="#15171B"/>
      <circle cx="582" cy="185" r="31" fill="#AEB2B8"/>
      <line x1="591.0" y1="185.9" x2="610.9" y2="187.9" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="583.9" y1="193.8" x2="588.2" y2="213.3" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="574.2" y1="189.5" x2="557.0" y2="199.6" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="575.3" y1="179.0" x2="560.4" y2="165.7" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <line x1="585.6" y1="176.8" x2="593.7" y2="158.5" stroke="#15171B" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="582" cy="185" r="8"  fill="#7E838A"/>
    </g>

    <!-- shoulder crease so the flank is not a flat slab -->
    <path d="M300,104 L520,98 L524,108 L302,115 Z" fill="#3C424C" opacity="0.45"/>

    <!-- rocker trim -->
    <path d="M300,196 L524,190 L526,200 L302,206 Z" fill="#AEB2B8" opacity="0.35"/>

    <!-- door regions: interactive targets, hinged at the forward edge -->
    <path id="door-fl" d="M290,86 L434,82 L434,206 L290,209 Z" fill="none" stroke="#1B1E24" stroke-width="1.5"/>
    <path id="door-rl" d="M440,82 L532,80 L532,203 L440,206 Z" fill="none" stroke="#1B1E24" stroke-width="1.5"/>
    <circle cx="415" cy="92" r="3" fill="#AEB2B8" opacity="0.8"/>
    <circle cx="515" cy="90" r="3" fill="#AEB2B8" opacity="0.8"/>
  </g>
</svg>
