<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="375" height="812" fill="#F2F2F2"/>
  
  <!-- Header / AppBar -->
  <rect width="375" height="60" fill="white"/>
  <text x="20" y="38" font-family="Jost" font-size="18" font-weight="600" fill="#2D2926">VOLVO</text>
  <rect x="260" y="15" width="95" height="30" rx="15" fill="#EFE9DD"/>
  <text x="307" y="35" text-anchor="middle" font-family="Jost" font-size="12" fill="#2D2926">VIN: YV1..▾</text>
  <line x1="0" y1="60" x2="375" y2="60" stroke="#E0E0E0"/>

  <!-- Hero Section (Car Blueprint) -->
  <g transform="translate(187.5, 220) scale(0.6)">
    <!-- Main Car Body -->
    <path d="M0,-250 C-50,-250 -70,-220 -80,-150 L-80,150 C-70,220 -50,250 0,250 C50,250 70,220 80,150 L80,-150 C70,-220 50,-250 0,-250 Z" stroke="#ACAAAE" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
    
    <!-- Status Overlays -->
    <path d="M-80,-120 L-85,-120 L-85,-20 L-80,-20" stroke="#6B8F71" stroke-width="8" fill="none"/>
    <path d="M80,-120 L85,-120 L85,-20 L80,-20" stroke="#6B8F71" stroke-width="8" fill="none"/>
    
    <text x="0" y="20" text-anchor="middle" font-family="Jost" font-size="24" font-weight="500" fill="#6B8F71">SECURE</text>
  </g>

  <!-- Category Selector (Horizontal Pills) -->
  <g transform="translate(20, 380)">
    <rect width="80" height="36" rx="18" fill="#2D2926"/>
    <text x="40" y="23" text-anchor="middle" font-family="Jost" font-size="12" font-weight="500" fill="white">Drive</text>
    
    <rect x="90" width="80" height="36" rx="18" fill="white" stroke="#E0E0E0"/>
    <text x="130" y="23" text-anchor="middle" font-family="Jost" font-size="12" fill="#7B8082">Security</text>
    
    <rect x="180" width="80" height="36" rx="18" fill="white" stroke="#E0E0E0"/>
    <text x="220" y="23" text-anchor="middle" font-family="Jost" font-size="12" fill="#7B8082">Safety</text>
    
    <rect x="270" width="80" height="36" rx="18" fill="white" stroke="#E0E0E0"/>
    <text x="310" y="23" text-anchor="middle" font-family="Jost" font-size="12" fill="#7B8082">Service</text>
  </g>

  <!-- Content Card (Drive View Example) -->
  <g transform="translate(20, 440)">
    <rect width="335" height="260" rx="24" fill="white"/>
    
    <!-- Gauges Row -->
    <g transform="translate(80, 80)">
      <circle r="40" stroke="#F2F2F2" stroke-width="8" fill="none"/>
      <path d="M-40,0 A40,40 0 1,1 40,0" stroke="#4F5A78" stroke-width="8" fill="none" stroke-linecap="round"/>
      <text y="5" text-anchor="middle" font-family="Jost" font-size="14" font-weight="600">72%</text>
      <text y="55" text-anchor="middle" font-family="Jost" font-size="10" fill="#7B8082">Fuel</text>
    </g>
    
    <g transform="translate(255, 80)">
      <circle r="40" stroke="#F2F2F2" stroke-width="8" fill="none"/>
      <path d="M-40,0 A40,40 0 1,1 25,-30" stroke="#C8D4E1" stroke-width="8" fill="none" stroke-linecap="round"/>
      <text y="5" text-anchor="middle" font-family="Jost" font-size="14" font-weight="600">88%</text>
      <text y="55" text-anchor="middle" font-family="Jost" font-size="10" fill="#7B8082">Battery</text>
    </g>

    <!-- Odometer Row -->
    <g transform="translate(20, 180)">
      <text font-family="Jost" font-size="10" fill="#7B8082">ODOMETER</text>
      <text y="35" font-family="Jost" font-size="32" font-weight="300" fill="#2D2926">12,450 km</text>
      <rect y="50" width="295" height="4" rx="2" fill="#F2F2F2"/>
      <rect y="50" width="220" height="4" rx="2" fill="#ACAAAE"/>
    </g>
  </g>

  <!-- Sticky Bottom Command Bar -->
  <rect y="732" width="375" height="80" fill="white"/>
  <line x1="0" y1="732" x2="375" y2="732" stroke="#E0E0E0"/>
  
  <g transform="translate(37, 760)">
    <!-- Command Icons (Placeholders) -->
    <circle r="20" fill="#F2F2F2"/> <text y="5" text-anchor="middle" font-size="16">🔒</text>
    <circle cx="75" r="20" fill="#F2F2F2"/> <text x="75" y="5" text-anchor="middle" font-size="16">🔓</text>
    <circle cx="150" r="20" fill="#2D2926"/> <text x="150" y="5" text-anchor="middle" font-size="16">⚡</text>
    <circle cx="225" r="20" fill="#F2F2F2"/> <text x="225" y="5" text-anchor="middle" font-size="16">❄️</text>
    <circle cx="300" r="20" fill="#F2F2F2"/> <text x="300" y="5" text-anchor="middle" font-size="16">⋮</text>
  </g>
</svg>
