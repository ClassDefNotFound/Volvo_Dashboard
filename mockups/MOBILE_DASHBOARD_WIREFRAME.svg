<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mobile layout. Mirrors the Figma frame "Mobile - Vehicle Status" (Volvo Dashboard page).

    MOBILE IS HERO-ONLY. There is no view toggle and no top-down diagnostic here. The hero is the
    photographic exteriorImageUrl render, which cannot show which door is ajar - so on mobile the
    ROLL-UP IS THE ONLY PART-LEVEL SIGNAL, and it is load-bearing in a way the desktop's is not.
    That is why it names the hidden parts explicitly ("+2 not visible here - Rear left window,
    Rear right tyre") rather than offering a switch-view affordance: there is no other view to
    switch to.

    This matches what BMW ships - one consolidated statement, no per-part graphic - and it is why
    the roll-up must read from the FULL summary, never from what happens to be visible.

    Windows are not drawn and get no dedicated rail on mobile either; all five WindowStatus fields
    roll up to the single "Windows" row inside the Security detail card. The desktop's GLASS rail
    is a wide-viewport affordance. See notes/CAR_VISUALIZATION_DESIGN.md.

    Demo state, shared with the other three mockups so they can be read against each other:
    front-left door ajar, rear-left window ajar, rear-right tyre low. The Figma frame this mirrors
    showed "Windows - All closed"; that one value was changed here to keep the scenario consistent
    across the set. "ajar" rather than "open" because AJAR is the literal
    WindowAndLockStatusValues member.
  -->
  <rect width="375" height="812" fill="#F2EFEA"/>

  <!-- AppBar -->
  <rect width="375" height="60" fill="#FFFFFF"/>
  <text x="20" y="35" font-family="Jost" font-size="14" font-weight="600" letter-spacing="2" fill="#1A1A1A">VOLVO</text>
  <rect x="231" y="15" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#E6E2DC"/>
  <text x="293" y="34" text-anchor="middle" font-family="Jost" font-size="11" fill="#3C3C42">YV1·····4821  ▾</text>

  <!-- Hero: the photographic exteriorImageUrl render. No vector parts, so nothing to outline. -->
  <rect x="18" y="78" width="339" height="110" rx="16" fill="#EAE6E0" stroke="#E2DED8"/>
  <text x="187.5" y="130" text-anchor="middle" font-family="Jost" font-size="12" fill="#8E8A85">exteriorImageUrl</text>
  <text x="187.5" y="148" text-anchor="middle" font-family="Jost" font-size="10" fill="#ACA8A2">photographic hero · identity, not triage</text>

  <!-- Roll-up: reads the FULL summary. The second line names what the hero cannot show. -->
  <circle cx="24" cy="207" r="4" fill="#CF6679"/>
  <text x="34" y="210" font-family="Jost" font-size="14" font-weight="500" fill="#1A1A1A">Front left door ajar</text>
  <text x="34" y="227" font-family="Jost" font-size="11" fill="#8E3D49">+2 not visible here · Rear left window · Rear right tyre</text>

  <!-- Category pills (NOT a bottom nav - the bottom bar is commands) -->
  <rect x="18" y="248" width="66" height="34" rx="17" fill="#FFFFFF" stroke="#E6E2DC"/>
  <text x="51" y="269" text-anchor="middle" font-family="Jost" font-size="12" fill="#5C5C62">Drive</text>
  <rect x="92" y="248" width="80" height="34" rx="17" fill="#2A3B4C"/>
  <text x="132" y="269" text-anchor="middle" font-family="Jost" font-size="12" font-weight="500" fill="#FFFFFF">Security</text>
  <rect x="180" y="248" width="66" height="34" rx="17" fill="#FFFFFF" stroke="#E6E2DC"/>
  <text x="213" y="269" text-anchor="middle" font-family="Jost" font-size="12" fill="#5C5C62">Safety</text>
  <rect x="254" y="248" width="70" height="34" rx="17" fill="#FFFFFF" stroke="#E6E2DC"/>
  <text x="289" y="269" text-anchor="middle" font-family="Jost" font-size="12" fill="#5C5C62">Service</text>

  <!-- Always-on summary card -->
  <rect x="18" y="300" width="339" height="226" rx="18" fill="#FFFFFF"/>

  <path d="M56,376 A40,40 0 0,1 136,376" fill="none" stroke="#E6E2DC" stroke-width="8" stroke-linecap="round"/>
  <path d="M56,376 A40,40 0 0,1 121.5,345.2" fill="none" stroke="#2A3B4C" stroke-width="8" stroke-linecap="round"/>
  <text x="96" y="374" text-anchor="middle" font-family="Jost" font-size="20" font-weight="600" fill="#1A1A1A">72%</text>
  <text x="96" y="390" text-anchor="middle" font-family="Jost" font-size="10" letter-spacing="1" fill="#6B6B70">FUEL</text>

  <path d="M222,376 A40,40 0 0,1 302,376" fill="none" stroke="#E6E2DC" stroke-width="8" stroke-linecap="round"/>
  <path d="M222,376 A40,40 0 0,1 299.2,361.3" fill="none" stroke="#6B8F71" stroke-width="8" stroke-linecap="round"/>
  <text x="262" y="374" text-anchor="middle" font-family="Jost" font-size="20" font-weight="600" fill="#1A1A1A">88%</text>
  <text x="262" y="390" text-anchor="middle" font-family="Jost" font-size="10" letter-spacing="1" fill="#6B6B70">BATTERY</text>

  <rect x="42" y="416" width="291" height="1" fill="#E6E2DC"/>
  <text x="42" y="455" font-family="Jost" font-size="26" font-weight="300" fill="#1A1A1A">12,450</text>
  <text x="134" y="453" font-family="Jost" font-size="12" fill="#6B6B70">km</text>
  <text x="42" y="474" font-family="Jost" font-size="10" letter-spacing="1" fill="#6B6B70">ODOMETER</text>
  <rect x="42" y="488" width="291" height="5" rx="2.5" fill="#E6E2DC"/>
  <rect x="42" y="488" width="204" height="5" rx="2.5" fill="#2A3B4C"/>
  <text x="42" y="511" font-family="Jost" font-size="11" fill="#6B6B70">Next service in 4,550 km</text>

  <!-- Selected category detail. Windows roll up to ONE row here - no glass rail on mobile. -->
  <rect x="18" y="540" width="339" height="168" rx="18" fill="#FFFFFF"/>
  <text x="38" y="566" font-family="Jost" font-size="10" font-weight="600" letter-spacing="1" fill="#6B6B70">SECURITY</text>

  <circle cx="41.5" cy="592.5" r="3.5" fill="#6B8F71"/>
  <text x="54" y="595" font-family="Jost" font-size="13" fill="#3C3C42">Central lock</text>
  <text x="337" y="595" text-anchor="end" font-family="Jost" font-size="13" font-weight="500" fill="#6B8F71">Locked</text>
  <rect x="54" y="606" width="283" height="1" fill="#EFEBE5"/>

  <circle cx="41.5" cy="622.5" r="3.5" fill="#CF6679"/>
  <text x="54" y="625" font-family="Jost" font-size="13" fill="#3C3C42">Windows</text>
  <text x="337" y="625" text-anchor="end" font-family="Jost" font-size="13" font-weight="500" fill="#CF6679">1 ajar · rear left</text>
  <rect x="54" y="636" width="283" height="1" fill="#EFEBE5"/>

  <circle cx="41.5" cy="652.5" r="3.5" fill="#6B8F71"/>
  <text x="54" y="655" font-family="Jost" font-size="13" fill="#3C3C42">Tailgate</text>
  <text x="337" y="655" text-anchor="end" font-family="Jost" font-size="13" font-weight="500" fill="#6B8F71">Closed</text>
  <rect x="54" y="666" width="283" height="1" fill="#EFEBE5"/>

  <circle cx="41.5" cy="682.5" r="3.5" fill="#CF6679"/>
  <text x="54" y="685" font-family="Jost" font-size="13" fill="#3C3C42">Front left door</text>
  <text x="337" y="685" text-anchor="end" font-family="Jost" font-size="13" font-weight="500" fill="#CF6679">Ajar</text>

  <!-- Sticky COMMAND bar -->
  <rect y="724" width="375" height="88" fill="#FFFFFF"/>
  <rect y="724" width="375" height="1" fill="#E2DED8"/>
  <g fill="#F2EFEA">
    <circle cx="52" cy="768" r="22"/>
    <circle cx="120" cy="768" r="22"/>
    <circle cx="188" cy="768" r="22"/>
    <circle cx="256" cy="768" r="22"/>
    <circle cx="324" cy="768" r="22"/>
  </g>
  <g stroke="#3C3C42" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- lock -->
    <rect x="44.5" y="766" width="15" height="10" rx="2.5"/>
    <path d="M48,766 v-3 a4,4 0 0,1 8,0 v3"/>
    <!-- unlock -->
    <rect x="112.5" y="766" width="15" height="10" rx="2.5"/>
    <path d="M116,766 v-3 a4,4 0 0,1 8,0"/>
    <!-- engine / power -->
    <path d="M188,760 v8"/>
    <path d="M182.5,762.5 a8,8 0 1,0 11,0"/>
    <!-- climate -->
    <path d="M248,764 h16"/>
    <path d="M248,769 h10"/>
    <path d="M248,774 h13"/>
  </g>
  <g fill="#3C3C42">
    <circle cx="318" cy="768" r="1.6"/>
    <circle cx="324" cy="768" r="1.6"/>
    <circle cx="330" cy="768" r="1.6"/>
  </g>
</svg>
